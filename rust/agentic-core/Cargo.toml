[workspace]
resolver = "2"
members = [
  "crates/agentic-pty",
  "crates/agentic-ssh",
  "crates/agentic-vte",
  "crates/agentic-tunnel",
  "crates/agentic-session",
  "crates/agentic-agent-core",
  "crates/agentic-memory",
  "crates/agentic-event",
  "crates/agentic-protocol",
  "crates/agentic-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.82"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
bytes = "1"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
libc = "0.2"
nix = { version = "0.29", features = ["term", "process", "signal", "ioctl"] }
russh = "0.49"
russh-keys = "0.49"
zeroize = { version = "1", features = ["derive"] }
x25519-dalek = "2"
ed25519-dalek = "2"
sha2 = "0.10"
async-trait = "0.1"