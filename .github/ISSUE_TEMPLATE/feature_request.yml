name: Feature Request
description: Propose a new feature or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What problem does this feature solve? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed Solution, description: Describe the desired behavior. }
    validations: { required: true }
