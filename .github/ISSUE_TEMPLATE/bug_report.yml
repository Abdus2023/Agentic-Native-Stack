name: Bug Report
description: Report a reproducible bug.
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes: { label: Summary, description: What happened? }
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes: { label: Reproduction, description: Steps to reproduce the behavior. }
    validations: { required: true }
